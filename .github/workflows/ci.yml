name: Check journal app

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test journal behavior
        run: npm test
      - name: Check JavaScript syntax
        run: npm run check
      - name: Build static assets
        run: npm run build
